# wassaphas.com — portfolio (Next.js standalone on 127.0.0.1:3100, PM2 app "wassaphas").
# Installed at /etc/nginx/sites-available/wassaphas.com and symlinked into sites-enabled.
#
# Traffic: Cloudflare (proxied, SSL mode Full (strict)) -> this nginx -> Next.
# Certificate from Let's Encrypt over HTTP-01 on port 80:
#   certbot certonly --webroot -w /var/www/html --cert-name wassaphas.com -d wassaphas.com -d www.wassaphas.com
# The 443 blocks fail `nginx -t` until that certificate exists, so on a fresh box enable
# only the port-80 block first.

server {
  listen 80;
  listen [::]:80;
  server_name wassaphas.com www.wassaphas.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://wassaphas.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.wassaphas.com;

  ssl_certificate     /etc/letsencrypt/live/wassaphas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wassaphas.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://wassaphas.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name wassaphas.com;

  ssl_certificate     /etc/letsencrypt/live/wassaphas.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wassaphas.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  client_max_body_size 1m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # Hashed build assets never change for a given URL.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
